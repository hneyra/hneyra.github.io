# Builds the site with Jekyll, generates the CV PDFs, checks the links and publishes to GitHub Pages.
# In the repository: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running one finish
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Ruby version comes from .ruby-version
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - id: pages
        uses: actions/configure-pages@v6

      - name: Build site
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      # Only the Playwright library: the PDFs are printed with the Google Chrome that is
      # preinstalled on the runner, so no browser download or apt packages are needed
      - name: Install PDF tooling
        run: npm ci
        timeout-minutes: 3

      # Prints each page to the file its download link points to,
      # so the published PDFs always match the published pages
      - name: Generate CV PDFs
        run: node scripts/build-pdf.mjs --site _site --baseurl "${{ steps.pages.outputs.base_path }}" --channel chrome
        timeout-minutes: 5

      # Fails the deployment if any internal link, image or PDF is missing
      - name: Check links
        run: python3 scripts/check-links.py _site "${{ steps.pages.outputs.base_path }}"
        timeout-minutes: 2

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    # Pull requests only build and check; they never publish
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
